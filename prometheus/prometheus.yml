global:
  scrape_interval: 15s
  evaluation_interval: 15s


scrape_configs:

  # Prometheus
  - job_name: "prometheus"

    static_configs:
      - targets:
          - "prometheus:9090"


  # Linux Node Exporter
  - job_name: "linux"

    static_configs:
      - targets:
          - "192.168.1.100:9100"


  # Windows Exporter
  - job_name: "windows"

    static_configs:
      - targets:
          - "192.168.1.101:9182"


  # SNMP Network Devices
  - job_name: "network-devices"

    metrics_path: /snmp

    params:
      module:
        - if_mib

    static_configs:
      - targets:
          - "192.168.1.200"

    relabel_configs:

      - source_labels:
          - __address__

        target_label: __param_target


      - source_labels:
          - __param_target

        target_label: instance


      - target_label: __address__

        replacement: snmp-exporter:9116
